name: Android CI/CD

on:
  push:
    branches: 
    
  pull_request:
    branches:     

jobs:
  build-and-sign:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "KEYSTORE_FILE=$KEYSTORE_FILE" > keystore.properties
        echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> keystore.properties
        echo "KEY_ALIAS=$KEY_ALIAS" >> keystore.properties
        echo "KEY_PASSWORD=$KEY_PASSWORD" >> keystore.properties
        ./gradlew :app:assembleFullRelease

    - name: Archive APK
      uses: actions/upload-artifact@v4
      with:
        name: app-full-release.apk
        path: app/build/outputs/apk/full/release/app-full-release.apk
    - name: List files in output directory
      run: |
          ls -R app/build/outputs/apk/full/release/
